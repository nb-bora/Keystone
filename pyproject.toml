[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-iam"
version = "0.2.0"
description = "Universal, Pluggable & Domain-Driven IAM Engine for Python & Django"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Aegis Core Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["pyyaml>=6.0", "httpx>=0.25.0", "typing-extensions>=4.0.0"]

[project.optional-dependencies]
django = ["django>=4.2"]
sqlalchemy = ["sqlalchemy>=2.0", "psycopg2-binary>=2.9.0"]
redis = ["redis>=5.0"]
alembic = ["alembic>=1.12.0"]
asyncio = ["asyncio>=3.4.3"]
fastapi = ["fastapi>=0.104.0", "uvicorn>=0.24.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "alembic>=1.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "S", "N", "UP"]
ignore = ["E501", "B008", "S104", "S110", "UP006", "UP035", "UP045"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "pydantic.*",
    "sqlalchemy.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aegis.drivers.fastapi.*"
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
