name: Aegis Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  quality-and-test:
    name: Code Quality & Unit Test Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Tooling Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-cov bandit safety alembic

    - name: Run Ruff Linter & Formatter Check
      run: |
        ruff check src/
        ruff format --check src/

    - name: Run Security Scan (Bandit)
      run: |
        bandit -r src/ -f json -o bandit-report.json || true

    - name: Run Safety Check
      run: |
        safety check --json || true

    - name: Run Unit Tests
      run: |
        PYTHONPATH=src python -m unittest discover -s tests -p "test_*.py" -v

    - name: Upload Coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests

  integration-tests:
    name: Integration Tests with PostgreSQL
    runs-on: ubuntu-latest
    needs: quality-and-test
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aegis_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,sqlalchemy,alembic]"
        pip install psycopg2-binary

    - name: Run Database Migrations
      run: |
        echo "Skipping migrations for CI (db setup required)"
        # alembic upgrade head || echo "Migrations skipped"
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aegis_test_db

    - name: Run Integration Tests
      run: |
        pytest tests/test_fastapi_driver.py -v
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aegis_test_db

  docker-build-check:
    name: Docker Multi-Stage Build Check
    runs-on: ubuntu-latest
    needs: [quality-and-test, integration-tests]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: aegis-iam:ci-latest

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: quality-and-test
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security tab
      if: hashFiles('trivy-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  build-and-publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: [docker-build-check, security-audit]
    if: github.event_name == 'release' && github.event.action == 'created'
    permissions:
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          aegisiam/aegis-iam:${{ github.event.release.tag_name }}
          aegisiam/aegis-iam:latest

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-and-publish]
    if: github.event_name == 'release' && github.event.action == 'created'
    permissions:
      id-token: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*
