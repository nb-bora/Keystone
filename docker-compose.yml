version: '3.8'

# ==============================================================================
# Aegis IAM Enterprise Stack - Multi-Network Isolated Architecture
# ==============================================================================
# Network Segmentation:
# - public_net : Exposition publique (API, pgAdmin, Grafana)
# - db_net     : Réseau privé réservé (API ↔ Postgres ↔ pgAdmin). POSTGRES NON EXPOSÉ !
# - app_net    : Réseau privé réservé (API ↔ Redis)
# - admin_net  : Réseau privé réservé (Portainer, Prometheus)
# ==============================================================================

networks:
  public_net:
    driver: bridge
  db_net:
    driver: bridge
    internal: true # Réseau strictement privé sans accès réseau externe direct
  app_net:
    driver: bridge
    internal: true
  admin_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  portainer_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

services:
  # --- 1. APPLICATION API AEGIS ---
  aegis-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-iam-api
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-aegisuser}:${POSTGRES_PASSWORD:-aegissupersecretpassword123!}@postgres:5432/${POSTGRES_DB:-aegis_iam_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    networks:
      - public_net
      - db_net
      - app_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- 2. BASE DE DONNÉES POSTGRESQL 16 (NON EXPOSÉE SUR L'HÔTE) ---
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegisuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegissupersecretpassword123!}
      POSTGRES_DB: ${POSTGRES_DB:-aegis_iam_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegisuser} -d ${POSTGRES_DB:-aegis_iam_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # --- 3. PGADMIN 4 (ADMINISTRATION POSTGRESQL) ---
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aegis-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@aegis.internal}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-PgAdminSecurePass2026!}
      PGADMIN_CONFIG_SERVER_MODE: 'True'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - public_net
      - db_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --- 4. PORTAINER CE (GESTION DU DOCKER ENGINE) ---
  portainer:
    image: portainer/portainer-ce:latest
    container_name: aegis-portainer
    ports:
      - "${PORTAINER_PORT:-9000}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - admin_net
      - public_net
    restart: unless-stopped

  # --- 5. REDIS CACHE & SESSION ---
  redis:
    image: redis:7-alpine
    container_name: aegis-redis-cache
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- 6. PROMETHEUS (COLLECTE DES MÉTRIQUES) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: aegis-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - admin_net
      - public_net
    restart: unless-stopped

  # --- 7. GRAFANA (DASHBOARDS D'OBSERVABILITÉ) ---
  grafana:
    image: grafana/grafana:latest
    container_name: aegis-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-GrafanaSecureAdminPass2026!}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - public_net
    restart: unless-stopped
